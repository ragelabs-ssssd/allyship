<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Photo Review - Whole Person Framing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] text-white p-8 max-w-7xl mx-auto font-sans">
  <h1 class="text-2xl font-bold mb-2">Uncropped Photographs Comparison</h1>
  <p class="text-sm text-neutral-400 mb-8">Inspect the full frame of each candidate photograph to see the entire posture and stage context.</p>

  <div class="grid grid-cols-2 gap-8">
    <div class="border border-white/10 rounded-2xl p-4 bg-neutral-900">
      <span class="text-xs font-mono text-[#C5A869]">IMG_7328.jpg (User uploaded recently)</span>
      <div class="mt-2 rounded-xl overflow-hidden bg-black border border-white/5">
        <img src="/thumb_IMG_7328.jpg" class="w-full h-auto object-contain">
      </div>
    </div>

    <div class="border border-white/10 rounded-2xl p-4 bg-neutral-900">
      <span class="text-xs font-mono text-[#C5A869]">IMG_7364.jpg (Original in previous layout)</span>
      <div class="mt-2 rounded-xl overflow-hidden bg-black border border-white/5">
        <img src="/thumb_IMG_7364.jpg" class="w-full h-auto object-contain">
      </div>
    </div>

    <div class="border border-white/10 rounded-2xl p-4 bg-neutral-900">
      <span class="text-xs font-mono text-[#C5A869]">IMG_5765.jpg (Close-up with bouquet & LED)</span>
      <div class="mt-2 rounded-xl overflow-hidden bg-black border border-white/5">
        <img src="/thumb_IMG_5765.jpg" class="w-full h-auto object-contain">
      </div>
    </div>

    <div class="border border-white/10 rounded-2xl p-4 bg-neutral-900">
      <span class="text-xs font-mono text-[#C5A869]">IMG_7327.jpg (Stage gesture shot)</span>
      <div class="mt-2 rounded-xl overflow-hidden bg-black border border-white/5">
        <img src="/thumb_IMG_7327.jpg" class="w-full h-auto object-contain">
      </div>
    </div>
  </div>
</body>
</html>
