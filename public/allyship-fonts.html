<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Baskervville:ital@0;1&family=Bellefair&family=Bricolage+Grotesque:wght@600;700;800&family=Cormorant+SC:wght@600;700&family=DM+Sans:wght@400;500;600&family=Darker+Grotesque:wght@600;700;800&family=Elsie:wght@400;900&family=Forum&family=Gruppo&family=Inter:wght@400;500;600&family=Italiana&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Manrope:wght@400;500;600;700&family=Michroma&family=Outfit:wght@500;700&family=Philosopher:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poiret+One&family=Rufina:wght@700&family=Space+Grotesk:wght@500;600;700&family=Spectral:ital,wght@0,500;1,500&family=Syne:wght@600;700;800&family=Syncopate:wght@700&family=Tenor+Sans&family=Viaoda+Libre&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #121214;
      --surface-2: #18181B;
      --line: rgba(255, 255, 255, 0.11);
      --text: #FFFFFF;
      --muted: #A1A1AA;
      --gold: #C5A869;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 36px 24px 96px;
      line-height: 1.5;
    }
    .container { max-width: 1480px; margin: 0 auto; }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gold);
      display: block;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      max-width: 780px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--gold);
      background: rgba(197, 168, 105, 0.14);
      color: var(--gold);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 26px;
    }
    .pkg-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .pkg-card:hover {
      border-color: rgba(197, 168, 105, 0.55);
      transform: translateY(-2px);
    }
    .pkg-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }
    .pkg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .pkg-num {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--gold);
      background: rgba(197, 168, 105, 0.12);
      border: 1px solid rgba(197, 168, 105, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .pkg-group { font-size: 11px; color: var(--muted); }
    .preview-stage {
      background: radial-gradient(circle at top right, rgba(197, 168, 105, 0.08), transparent 55%), #070709;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .gold-pill {
      display: inline-block;
      background: rgba(197, 168, 105, 0.14);
      border: 1px solid rgba(197, 168, 105, 0.4);
      color: var(--gold);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hero-line { color: #ffffff; line-height: 1.1; }
    .sub-line { color: #d4d4d8; line-height: 1.4; }
    .body-line { color: #a1a1aa; font-size: 14px; line-height: 1.65; }
    .ui-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .cta-btn {
      background: var(--gold);
      color: #0A0A0A;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: none;
    }
    .font-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11.5px;
      background: var(--surface-2);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .spec-item span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .spec-item strong { color: #fff; font-weight: 600; }
    .select-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pkg-card.selected .select-btn {
      background: var(--gold);
      color: #0A0A0A;
      border-color: var(--gold);
    }
  </style>
</head>
<body>

    const grid = document.getElementById('pkgGrid');
    let selectedId = null;

    function render(group = 'all') {
      const list = group === 'all' ? packages : packages.filter(p => p.group === group);
      grid.innerHTML = list.map(p => `
        <div class="pkg-card ${selectedId === p.id ? 'selected' : ''}" data-id="${p.id}">
          <div class="pkg-top">
            <span class="pkg-num">Option #${p.id}</span>
            <span class="pkg-group">${p.vibe}</span>
          </div>
          <div style="font-size:18px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif;">${p.name}</div>

          <div class="preview-stage">
            <div class="badge-row">
              <span class="gold-pill" style="${p.bStyle}">Keynote Forum</span>
              <span style="${p.bStyle} font-size:11px; color:#a1a1aa;">SOA &bull; ALLYSHIP++</span>

            <div class="sub-line" style="${p.sStyle}">Executive Roundtables, Olympian Firesides &amp; Academic Partnerships.</div>
            <p class="body-line" style="${p.bStyle}">Convening CHROs, capability heads, and university leadership to cultivate inclusive, resilient workplaces across India.</p>
            <div class="ui-row">

            </div>
          </div>

          <div class="font-specs">
            <div class="spec-item"><span>Signature Accent</span><strong>${p.accent}</strong></div>
            <div class="spec-item"><span>Primary Heading</span><strong>${p.heading}</strong></div>

            ${selectedId === p.id ? '&#10003; Selected — Option #' + p.id : 'Select Option #' + p.id}
          </button>
        </div>
      `).join('');
    }

    window.selectPkg = (id) => {
      selectedId = id;
      render(document.querySelector('.filter-btn.active').dataset.group);
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.group);
      });
    });

    render();

</body>
