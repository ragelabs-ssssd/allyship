<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Creative Chapter Switcher Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] text-white p-6 sm:p-12 max-w-7xl mx-auto font-sans">
  <div class="mb-10 pb-6 border-b border-white/10">
    <span class="text-xs font-mono uppercase tracking-widest text-[#C5A869]">Chapter Navigation Redesign</span>
    <h1 class="text-3xl font-extrabold text-white mt-1">Creative "Chapter-Wise" Executive Switcher</h1>
    <p class="text-sm text-neutral-400 mt-1">Transforming flat buttons into interactive, numbered chapter dossiers with connecting timeline nodes.</p>
  </div>

  <!-- Redesigned Switcher with Timeline Ribbon and Active Downward Caret -->
  <div class="space-y-4">
    <!-- Milestone Progress Track Header -->
    <div class="flex items-center justify-between text-xs font-mono px-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#C5A869] animate-pulse"></span>
        <span class="text-neutral-300 uppercase tracking-wider font-semibold">National Conclave Journey</span>
      </div>
      <div class="flex items-center gap-4 text-[11px] text-neutral-400">
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span>Chapters 1–4 (Cycle 1.0)</span>
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#C5A869]"></span>Chapters 5–7 (Cycle 2.0)</span>
      </div>
    </div>

    <!-- Chapter Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
      <!-- Chapter 1 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 01</span>
          <span class="px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-[9px] font-mono font-bold text-neutral-400">1.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Bengaluru</h4>
          <p class="text-[11px] text-neutral-400 truncate">June 2024</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">Metropolitan Hub</span>
        </div>
      </button>

      <!-- Chapter 2 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 02</span>
          <span class="px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-[9px] font-mono font-bold text-neutral-400">1.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Hyderabad</h4>
          <p class="text-[11px] text-neutral-400 truncate">July 2024</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">Tech Corridor</span>
        </div>
      </button>

      <!-- Chapter 3 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 03</span>
          <span class="px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-[9px] font-mono font-bold text-neutral-400">1.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Kolkata</h4>
          <p class="text-[11px] text-neutral-400 truncate">September 2024</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">City Hub</span>
        </div>
      </button>

      <!-- Chapter 4 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 04</span>
          <span class="px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-[9px] font-mono font-bold text-neutral-400">1.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Mumbai</h4>
          <p class="text-[11px] text-neutral-400 truncate">October 2025</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">Financial Capital</span>
        </div>
      </button>

      <!-- Chapter 5 (ACTIVE) -->
      <button class="relative group p-4 rounded-2xl bg-[#C5A869]/10 border-2 border-[#C5A869] ring-4 ring-[#C5A869]/20 shadow-xl text-left transition-all duration-300 -translate-y-1">
        <!-- Top row -->
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-[#C5A869] tracking-wider flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-[#C5A869] animate-pulse"></span>
            CH · 05
          </span>
          <span class="px-2 py-0.5 rounded-full bg-[#C5A869] text-black text-[9px] font-mono font-bold uppercase tracking-wider shadow-sm">2.0</span>
        </div>
        <!-- Center -->
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white tracking-normal truncate">Bengaluru</h4>
          <p class="text-[11px] text-[#C5A869] font-medium truncate">March 2026</p>
        </div>
        <!-- Bottom -->
        <div class="mt-3 pt-2 border-t border-[#C5A869]/20 flex items-center justify-between text-[10px] text-[#C5A869]">
          <span class="truncate font-semibold">Active Chapter</span>
          <span class="text-xs">▾</span>
        </div>
        <!-- Downward Pointer Caret -->
        <div class="absolute -bottom-2.5 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-[#C5A869]"></div>
      </button>

      <!-- Chapter 6 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 06</span>
          <span class="px-2 py-0.5 rounded-full bg-[#C5A869]/20 border border-[#C5A869]/40 text-[9px] font-mono font-bold text-[#C5A869]">2.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Hyderabad</h4>
          <p class="text-[11px] text-neutral-400 truncate">May 2026</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">Le Meridien</span>
        </div>
      </button>

      <!-- Chapter 7 -->
      <button class="relative group p-4 rounded-2xl bg-neutral-900/70 border border-white/10 hover:border-[#C5A869]/60 text-left transition-all duration-300 hover:-translate-y-1 overflow-hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-mono font-bold text-neutral-400 group-hover:text-[#C5A869] tracking-wider">CH · 07</span>
          <span class="px-2 py-0.5 rounded-full bg-[#C5A869]/20 border border-[#C5A869]/40 text-[9px] font-mono font-bold text-[#C5A869]">2.0</span>
        </div>
        <div class="space-y-0.5">
          <h4 class="text-sm font-bold text-white group-hover:text-[#C5A869] transition-colors truncate">Chennai</h4>
          <p class="text-[11px] text-neutral-400 truncate">July 2026</p>
        </div>
        <div class="mt-3 pt-2 border-t border-white/5 flex items-center justify-between text-[10px] text-neutral-500">
          <span class="truncate">Executive Hub</span>
        </div>
      </button>
    </div>
  </div>
</body>
</html>
