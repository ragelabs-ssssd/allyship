    :root {

      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 36px 24px 96px;
      line-height: 1.5;
    }
    .container { max-width: 1480px; margin: 0 auto; }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--yellow);
      display: block;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      max-width: 720px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--yellow);
      background: rgba(250, 204, 21, 0.14);
      color: var(--yellow);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
      gap: 26px;
    }
    .pkg-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .pkg-card:hover {
      border-color: rgba(250, 204, 21, 0.55);
      transform: translateY(-2px);
    }
    .pkg-card.selected {
      border-color: var(--yellow);
      box-shadow: 0 0 0 1px var(--yellow);
    }
    .pkg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .pkg-num {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--yellow);
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .pkg-group {
      font-size: 11px;
      color: var(--muted);
    }
    .preview-stage {
      background: #070709;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .yellow-badge {
      display: inline-block;
      background: var(--yellow);
      color: #09090b;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .hero-line {
      color: #ffffff;
      line-height: 1.05;
    }
    .sub-line {
      color: #d4d4d8;
      line-height: 1.35;
    }
    .body-line {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
    }
    .ui-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .cta-btn {
      background: var(--yellow);
      color: #09090b;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: none;
    }
    .font-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11.5px;
      background: var(--surface-2);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .spec-item span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .spec-item strong { color: #fff; font-weight: 600; }
    .select-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pkg-card.selected .select-btn {
      background: var(--yellow);
      color: #09090b;
      border-color: var(--yellow);
    }
