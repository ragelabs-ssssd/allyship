<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALLYSHIP++ — Motion Lab: Section 7 (Final CTA &amp; Footer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080A;
      --surface: #121215;
      --surface-2: #18181C;
      --line: rgba(255, 255, 255, 0.12);
      --gold: #C5A869;
      --text: #FFFFFF;
      --muted: #A1A1AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 36px 24px 110px;
      line-height: 1.5;
    }
    .container { max-width: 1480px; margin: 0 auto; }
    .header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 30px;
    }
    .done-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: #6EE7B7;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      margin-right: 8px;
    }
    .step-badge {
      display: inline-block;
      font-family: 'Unbounded', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #0A0A0A;
      background: var(--gold);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(22px, 2.8vw, 32px); font-weight: 800; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 760px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(197, 168, 105, 0.55); }
    .card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .card-head {
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141418;
    }
    .opt-num {
      font-family: 'Unbounded', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(197, 168, 105, 0.12);
      border: 1px solid rgba(197, 168, 105, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .trig { font-size: 10.5px; color: var(--muted); font-family: monospace; }

    .demo {
      height: 160px;
      background: #070709;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }
    .card-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      flex: 1;
    }
    .opt-name { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; }
    .opt-desc { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    .pick-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .card.selected .pick-btn { background: var(--gold); color: #0A0A0A; border-color: var(--gold); }
    .u { font-family: 'Unbounded', sans-serif; }
    .gold { color: var(--gold); }

    @keyframes horGlow { 0%, 100% { transform: scale(0.95); opacity: 0.25; } 50% { transform: scale(1.12); opacity: 0.55; } }
    .hor-orb { width: 150px; height: 70px; border-radius: 999px; background: radial-gradient(ellipse, rgba(197,168,105,0.6), transparent 70%); animation: horGlow 4s ease-in-out infinite; }

    @keyframes sweep { 0% { transform: translateX(-140%) skewX(-20deg); } 100% { transform: translateX(240%) skewX(-20deg); } }
    .shim-btn { position: relative; overflow: hidden; background: var(--gold); color: #0A0A0A; padding: 10px 22px; border-radius: 999px; font-size: 12.5px; font-weight: 700; border: none; cursor: pointer; }
    .shim-btn::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent); animation: sweep 2.4s infinite; }

    @keyframes spinBorder { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .beam-wrap { position: relative; padding: 1.5px; border-radius: 999px; overflow: hidden; display: inline-block; }
    .beam-wrap::before { content: ''; position: absolute; inset: -100%; background: conic-gradient(transparent 260deg, #C5A869 360deg); animation: spinBorder 2.6s linear infinite; }
    .beam-inner { position: relative; background: #121215; color: #fff; padding: 8px 18px; border-radius: 999px; font-size: 12px; font-weight: 700; }

    .action-bar {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(16, 16, 20, 0.95); backdrop-filter: blur(14px);
      border: 1px solid rgba(197, 168, 105, 0.5); border-radius: 999px;
      padding: 10px 14px 10px 22px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.75); z-index: 60;
    }
    .copy-btn { background: var(--gold); color: #0A0A0A; border: none; padding: 8px 18px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <span class="done-pill">&#10003; About #03 Applied</span>
        <span class="done-pill">&#10003; Agenda #14 Applied</span>
        <span class="step-badge">Section 7 of 7 &bull; Final CTA &amp; Footer</span>
        <h1>15 Creative CTA &amp; Footer Motion Options</h1>
        <p class="sub">Final section! Test all 15 CTA Banner, Newsletter &amp; Footer interactions below and tell me which <strong>Footer #(s)</strong> you want to apply live!</p>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="action-bar">
    <span style="font-size:12px; color:#E4E4E7;" id="selText">0 Footer options selected</span>
    <button class="copy-btn" id="copyBtn">Copy Footer Picks</button>
  </div>

  <script>
    const options = [
      { n: 1, name: 'Radial Gold Horizon Glow Pulse', trig: 'ambient (8s)', desc: 'Ambient gold radial backdrop gently breathes behind the Executive CTA Banner.', demo: `<div class="hor-orb"></div>` },
      { n: 2, name: 'CTA Button Shimmer + Lift', trig: 'hover / ambient', desc: 'Diagonal metallic sheen sweeps across the primary Get Invited button.', demo: `<button class="shim-btn">Request Invitation &rarr;</button>` },
      { n: 3, name: 'Rotating Border Beam CTA', trig: 'ambient', desc: 'A luminous gold dot orbits smoothly around the secondary CTA border.', demo: `<div class="beam-wrap"><div class="beam-inner">Partner With SOA &rarr;</div></div>` },
      { n: 4, name: 'Staggered 3-Column Footer Entrance', trig: 'scroll-into-view', desc: 'Institutional Essence, Dossier Index & Briefings glide upward 90ms apart.', demo: `<div style="display:flex;gap:8px;"><div style="width:45px;height:40px;background:#18181C;border:1px solid var(--gold);border-radius:6px;"></div><div style="width:45px;height:40px;background:#18181C;border:1px solid var(--line);border-radius:6px;margin-top:6px;"></div><div style="width:45px;height:40px;background:#18181C;border:1px solid var(--line);border-radius:6px;margin-top:12px;"></div></div>` },
      { n: 5, name: 'Dossier Link Arrow Slide', trig: 'hover', desc: 'Hovering any footer link slides its gold → arrow cleanly into view.', demo: `<span style="font-size:12px;cursor:pointer;" onmouseover="this.querySelector('b').style.transform='translateX(6px)';this.querySelector('b').style.opacity='1'" onmouseout="this.querySelector('b').style.transform='none';this.querySelector('b').style.opacity='0.35'">Conclave Chapters <b style="display:inline-block;color:var(--gold);opacity:0.35;transition:all 0.2s;">&rarr;</b></span>` },
      { n: 6, name: 'Briefing Success Spring Morph', trig: 'submit', desc: 'Footer newsletter form morphs smoothly into a confirmed gold checkmark pill.', demo: `<span style="padding:6px 14px;border-radius:999px;background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.4);color:#34D399;font-size:11px;">&#10003; Briefing Dispatched</span>` },
      { n: 7, name: 'Subtle Watermark Scroll Drift', trig: 'scroll-scrub', desc: 'Faint oversized ALLYSHIP++ watermark drifts ±24px horizontally in the footer.', demo: `<div class="u" style="font-size:22px;color:rgba(197,168,105,0.2);">ALLYSHIP++</div>` },
      { n: 8, name: 'Smooth Spring Back-to-Top Pill', trig: 'click', desc: 'Minimal gold ↑ Top pill in the footer bottom bar glides smoothly to y = 0.', demo: `<button style="padding:7px 16px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11.5px;font-weight:700;cursor:pointer;" onclick="window.scrollTo({top:0,behavior:'smooth'})">&uarr; Back to Top</button>` },
      { n: 9, name: 'Modal Backdrop Blur Spring', trig: 'click (open)', desc: 'GetInvitedModal springs cleanly from scale 0.95 over blurred obsidian.', demo: `<span style="font-size:12px;color:var(--gold);">Spring Modal Entrance</span>` },
      { n: 10, name: 'Corridor City Pill Sequential Glow', trig: 'hover', desc: 'Footer corridor pills (Bhubaneswar, Bengaluru, Hyderabad...) illuminate gold on hover.', demo: `<div style="display:flex;gap:6px;"><span style="padding:4px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;font-size:10px;">Bhubaneswar</span><span style="padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:10px;">Hyderabad</span></div>` },
      { n: 11, name: 'Magnetic CTA Pill Pull', trig: 'cursor-move', desc: 'Footer & Banner CTA buttons gravitate gently toward your cursor.', demo: `<button class="shim-btn" onmousemove="const r=this.getBoundingClientRect();this.style.transform='translate('+((event.clientX-r.left-r.width/2)*0.22)+'px,'+((event.clientY-r.top-r.height/2)*0.22)+'px)'" onmouseleave="this.style.transform='none'">Magnetic CTA</button>` },
      { n: 12, name: 'Top Border Gold Progress Sweep', trig: 'scroll-into-view', desc: 'The footer top border draws outward from center in Champagne Gold.', demo: `<div style="width:80%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);"></div>` },
      { n: 13, name: 'Input Focus Gold Halo', trig: 'focus', desc: 'Briefing email input illuminates a soft gold focus ring when clicked.', demo: `<input placeholder="executive@company.com" style="padding:8px 14px;border-radius:999px;background:#141418;border:1px solid var(--line);color:#fff;font-size:11.5px;outline:none;transition:border-color 0.2s, box-shadow 0.2s;" onfocus="this.style.borderColor='var(--gold)';this.style.boxShadow='0 0 0 3px rgba(197,168,105,0.2)'" onblur="this.style.borderColor='var(--line)';this.style.boxShadow='none'" />` },
      { n: 14, name: 'Accreditation Badge Hover Pop', trig: 'hover', desc: 'NIRF #15 and NAAC A++ pills lift 2px with crisp gold border on hover.', demo: `<span style="padding:5px 12px;border-radius:999px;background:#141418;border:1px solid var(--line);font-size:11px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.transform='translateY(-3px)';this.style.borderColor='var(--gold)'" onmouseout="this.style.transform='none';this.style.borderColor='var(--line)'">NIRF #15 &bull; NAAC A++</span>` },
      { n: 15, name: 'Curtain Reveal Footer Unmask', trig: 'scroll', desc: 'Main page content glides smoothly over a fixed-feel bottom footer curtain.', demo: `<span style="font-size:12px;color:#d4d4d8;">Editorial Curtain Reveal</span>` }
    ];

    const picked = new Set();
    const grid = document.getElementById('grid');
    const selText = document.getElementById('selText');

    function render() {
      grid.innerHTML = options.map(o => {
        const key = 'Footer #' + String(o.n).padStart(2, '0');
        const isSel = picked.has(key);
        return `
          <div class="card ${isSel ? 'selected' : ''}">
            <div class="card-head">
              <span class="opt-num">${key}</span>
              <span class="trig">${o.trig}</span>
            </div>
            <div class="demo">${o.demo}</div>
            <div class="card-body">
              <div>
                <div class="opt-name">${o.name}</div>
                <p class="opt-desc">${o.desc}</p>
              </div>
              <button class="pick-btn" onclick="toggle('${key}')">
                ${isSel ? '&#10003; Selected ' + key : 'Select ' + key}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggle = (k) => {
      if (picked.has(k)) picked.delete(k); else picked.add(k);
      selText.textContent = picked.size ? `${picked.size} Footer option${picked.size > 1 ? 's' : ''} selected` : '0 Footer options selected';
      render();
    };

    document.getElementById('copyBtn').addEventListener('click', () => {
      const txt = 'Apply ' + [...picked].join(', ');
      navigator.clipboard?.writeText(txt);
      const b = document.getElementById('copyBtn');
      b.textContent = 'Copied!';
      setTimeout(() => b.textContent = 'Copy Footer Picks', 1800);
    });

    render();
  </script>
</body>
</html>
